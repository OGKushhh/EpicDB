name: Deploy to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build project
        # Map GitHub Secrets (unprefixed) to the VITE_-prefixed env vars Vite reads.
        # Vite only exposes vars starting with VITE_ to the client bundle at build time.
        env:
          VITE_MANIFEST_API_KEY: ${{ secrets.MANIFEST_API_KEY }}
          VITE_MANIFEST_API_BASE: ${{ secrets.MANIFEST_API_BASE }}
          VITE_EPIC_GRAPHQL_ENDPOINT: ${{ secrets.EPIC_GRAPHQL_ENDPOINT }}
        run: npm run build

      - name: Stage README for HF Space
        # HF needs README.md (with YAML front-matter) at the Space repo root to
        # configure sdk / app_file / pinned. The force-push below replaces the
        # entire Space repo, so we copy README into dist/ before pushing.
        run: cp README.md dist/README.md

      - name: Deploy to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          cd dist
          git init
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git remote add space https://OGKushhh:$HF_TOKEN@huggingface.co/spaces/OGKushhh/EpicDB
          git add .
          git commit -m "Deploy from GitHub Actions"
          git push --force space master:main
